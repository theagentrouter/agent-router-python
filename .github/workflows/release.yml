name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  verify:
    needs: checks
    runs-on: ubuntu-24.04
    outputs:
      companion-artifact-id: ${{ steps.verified-companion.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-local-darwin-arm64
          path: companion-dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-local-linux-amd64
          path: companion-dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-local-linux-arm64
          path: companion-dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-local-any
          path: companion-dist/
      - name: Verify SDK and all companion wheels are present
        run: |
          python - <<'PY'
          from pathlib import Path
          files = list(Path("dist").glob("*")) + list(Path("companion-dist").glob("*"))
          # darwin-arm64, linux-amd64, linux-arm64, and the py3-none-any fallback with no program
          assert len(list(Path("companion-dist").glob("theagentrouter_local_gateway-*.whl"))) == 4
          assert len(list(Path("companion-dist").glob("theagentrouter_local_gateway-*-py3-none-any.whl"))) == 1
          for name in ("theagentrouter_core", "theagentrouter"):
              assert len(list(Path("dist").glob(f"{name}-[0-9]*.whl"))) == 1, name
              assert len(list(Path("dist").glob(f"{name}-[0-9]*.tar.gz"))) == 1, name
          assert len(files) == 8
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: verified-companion
        with:
          name: verified-local-gateway
          path: companion-dist/*.whl
          if-no-files-found: error
          compression-level: 0

  # One job and one GitHub environment per package. PyPI accepts only one pending
  # trusted publisher per owner, repository, workflow and environment, so each
  # package needs its own environment until its project exists on PyPI.
  # Each package goes up after the ones it depends on: the gateway, the SDK, then theagentrouter.
  publish-local-gateway:
    needs: verify
    runs-on: ubuntu-24.04
    environment: pypi-local-gateway
    permissions:
      id-token: write   # PyPI trusted publishing; no token stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.companion-artifact-id }}
          path: companion-dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: companion-dist/
          skip-existing: true   # a rerun skips files already on PyPI

  publish-core:
    needs: publish-local-gateway
    runs-on: ubuntu-24.04
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - run: rm dist/theagentrouter-[0-9]*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true   # a rerun skips files already on PyPI

  publish-theagentrouter:
    needs: publish-core
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - run: rm dist/theagentrouter_core-*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true   # a rerun skips files already on PyPI
