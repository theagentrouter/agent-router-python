<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Your agent calls theagentrouter with LiteLLM's API; the SDK sends every call to an Agent Router gateway, local or your company's, which handles fallbacks, retries, request limits and provider keys, and calls the providers.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" rx="16" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#0f172a">

    <!-- Your agent -->
    <rect x="16" y="90" width="160" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="96" y="122" font-size="16" font-weight="600" text-anchor="middle">Your agent</text>
    <text x="96" y="150" font-size="13" text-anchor="middle" fill="#475569">Google ADK</text>
    <text x="96" y="170" font-size="13" text-anchor="middle" fill="#475569">OpenAI Agents SDK</text>
    <text x="96" y="190" font-size="13" text-anchor="middle" fill="#475569">your own code</text>

    <line x1="176" y1="150" x2="266" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="221" y="138" font-size="12" text-anchor="middle" fill="#475569">LiteLLM API</text>

    <!-- SDK -->
    <rect x="268" y="105" width="160" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="348" y="140" font-size="16" font-weight="600" text-anchor="middle">theagentrouter</text>
    <text x="348" y="164" font-size="13" text-anchor="middle" fill="#475569">the SDK, in your process</text>

    <line x1="428" y1="150" x2="476" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="452" y="138" font-size="12" text-anchor="middle" fill="#475569">HTTP</text>

    <!-- Gateway -->
    <rect x="478" y="60" width="204" height="180" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="580" y="92" font-size="16" font-weight="600" text-anchor="middle">Agent Router gateway</text>
    <text x="580" y="114" font-size="12" text-anchor="middle" fill="#475569">local, or your company's</text>
    <text x="580" y="148" font-size="13" text-anchor="middle">fallbacks</text>
    <text x="580" y="170" font-size="13" text-anchor="middle">retries</text>
    <text x="580" y="192" font-size="13" text-anchor="middle">request limits</text>
    <text x="580" y="214" font-size="13" text-anchor="middle">provider keys</text>

    <line x1="682" y1="150" x2="736" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Providers -->
    <rect x="738" y="30" width="138" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="807" y="58" font-size="16" font-weight="600" text-anchor="middle">Providers</text>
    <g font-size="13" text-anchor="middle" fill="#475569">
      <text x="807" y="88">OpenAI</text>
      <text x="807" y="110">Anthropic</text>
      <text x="807" y="132">Gemini</text>
      <text x="807" y="154">AWS Bedrock</text>
      <text x="807" y="176">Groq</text>
      <text x="807" y="198">Mistral</text>
      <text x="807" y="220">DeepSeek</text>
      <text x="807" y="242">Together</text>
    </g>
  </g>
</svg>
