[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# No code of its own: installs the SDK (theagentrouter-core) and, where it is built, the local gateway
# (theagentrouter-local-gateway). For a remote gateway only, install theagentrouter-core instead.
[project]
name = "theagentrouter"
version = "0.1.0a1"
description = "LiteLLM's API with Agent Router underneath: the SDK and the local gateway."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tetrate" }]
keywords = ["llm", "ai", "agents", "litellm", "openai", "anthropic", "gateway", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "theagentrouter-core==0.1.0a1",
    # One wheel per platform, plus a fallback wheel with no program that pip picks where none fits.
    "theagentrouter-local-gateway==0.1.0a1",
]

[project.optional-dependencies]
# Older instructions said theagentrouter[local-gateway]; the local gateway is a dependency already.
local-gateway = []
tokens = ["theagentrouter-core[tokens]==0.1.0a1"]

[project.urls]
Homepage = "https://github.com/theagentrouter/agent-router-python"

[tool.hatch.build.targets.wheel]
bypass-selection = true  # no code; this package only installs the other two

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "README.md", "LICENSE"]
